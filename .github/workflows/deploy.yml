name: Publish to GitHub Pages

# Pages is set to "Deploy from a branch" (main, root), so this builds the Astro source on
# `source` and commits the static output to `main`. See scripts/publish.sh and HANDOFF.md.
on:
  push:
    branches: [source]
  workflow_dispatch:

permissions:
  contents: write

# One publish at a time; let an in-progress one finish rather than cancelling it.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build and commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sh scripts/publish.sh
